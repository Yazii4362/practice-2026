<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

button{
    margin:50px;
    padding:10px 20px;
    cursor:pointer;
}

.popup-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-color: rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
    display:none;
}

.popup{
    background-color: orange;
    color: antiquewhite;
    width:300px;
    padding:20px;
    border-radius:10px;
    position:relative;
    text-align:center;
}

.popup-title a{
    position:absolute;
    right:10px;
    top:10px;
    background:#333;
    color:#fff;
    padding:5px 10px;
    border-radius:5px;
    text-decoration:none;
}
</style>
</head>

<body>

<button class="open-btn">이벤트를 확인해주세요!</button>

<div class="popup-bg">
    <div class="popup">
        <div class="popup-title">
            <span><a href="#" class="event-btn">X</a></span>
        </div>

        <div class="popup-body">
            <h2>이벤트에 당첨 되셨습니다.</h2>
        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(function(){

    
    $(".open-btn").click(function(){
        $(".popup-bg").fadeIn();
    });


    $(".event-btn").click(function(e){
        e.preventDefault();
        $(".popup-bg").fadeOut();
    });

});
</script>

</body>
</html>
