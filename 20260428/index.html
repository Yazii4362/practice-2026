<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", sans-serif;
            overflow-x: hidden;
            color: #111;
        }

        /* ===========================
   HERO
=========================== */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #fff;
        }

        /* 텍스트 영역 */
        .hero-title {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50vh;
            padding: 70px 80px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 10;
            color: #111;
        }

        .hero-title h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .hero-title h1 {
            font-size: 64px;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: -1px;
        }

        /* 이미지 처음 80% */
        .hero-image {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 80%;
            height: 50vh;
            transform: translateX(-50%);
            overflow: hidden;
            z-index: 1;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===========================
   NEXT SECTION
=========================== */
        .next-section {
            width: 100%;
            min-height: 100vh;
            background: #fff;
            padding: 120px 80px;
        }

        .next-section h2 {
            font-size: 46px;
            line-height: 1.45;
            font-weight: 700;
            color: #111;
        }
    </style>
</head>

<body>

    <section class="hero-section">

        <div class="hero-title">
            <h3>그룹사 현황</h3>
            <h1>
                우리 모두의 지속가능한 내일을 <br>
                만들어갑니다.
            </h1>
        </div>

        <div class="hero-image">
            <img src="assets/images/about-img-discover.png" alt="그룹사 현황">
        </div>

    </section>

    <section class="next-section">
        <h2>
            한화는 다양한 사업분야에서 개인, 사회, 지구의 지속가능한<br>
            내일을 위한 다양한 솔루션을 제공하며 성장을 이어가고 있습니다.
        </h2>
    </section>



    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        gsap.timeline({
            scrollTrigger: {
                trigger: ".hero-section",
                start: "top top",
                end: "+=1800",
                scrub: 1,
                pin: true,
                markers: true
            }
        })

            /* 이미지 80% → 100% + 위로 확장 */
            .to(".hero-image", {
                width: "100%",
                height: "100vh",
                left: "50%",
                xPercent: -50,
                duration: 1,
                ease: "none"
            }, 0)

            /* 텍스트 아래로 이동해서 마지막엔 이미지 하단 왼쪽 */
            .to(".hero-title", {
                top: "50vh",
                height: "50vh",
                color: "#fff",
                duration: 1,
                ease: "none"
            }, 0);

    </script>
</body>

</html>
