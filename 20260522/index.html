<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOYO HANNAM - by Parmas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  
  <!-- Hero Section (KV Area) -->
  <section class="hero-section relative w-full h-screen overflow-hidden">
    <!-- Background Video -->
    <div class="video-background absolute inset-0 w-full h-full">
      <video 
        class="w-full h-full object-cover" 
        autoplay 
        muted 
        loop 
        playsinline
      >
        <source src="https://soyo-hannam.com/images/vis-vd.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <!-- Video Overlay -->
      <div class="absolute inset-0 bg-black bg-opacity-40"></div>
    </div>

    <!-- Hero Content -->
    <div class="hero-content relative z-10 flex flex-col items-center justify-center h-full text-white text-center px-4">
      <!-- Sub Title -->
      <p class="subtitle text-sm md:text-base tracking-widest mb-4 opacity-90 animate-fade-in-up uppercase">
        BY PARMAS
      </p>
      
      <!-- Main Title -->
      <h1 class="main-title text-5xl md:text-7xl lg:text-8xl font-bold mb-6 tracking-tight animate-fade-in-up-delay-1 uppercase">
        SOYO HANNAM
      </h1>
      
      <!-- Auxiliary Title -->
      <p class="auxiliary-title text-lg md:text-xl lg:text-2xl tracking-wider font-light animate-fade-in-up-delay-2 uppercase">
        ITAEWON GALLERY OPEN
      </p>
    </div>
  </section>

  <!-- Quick Menu (Floating Buttons) -->
  <div class="quick fixed right-8 bottom-8 z-50 flex flex-col gap-4">
    <!-- Rotating Button 2 -->
    <div class="rot2 relative w-32 h-32 flex items-center justify-center">
      <a href="https://soyohannam.com/subscription/" target="_blank" class="block relative w-full h-full flex items-center justify-center">
        <div class="white-circle-bg"></div>
        <span class="relative" style="z-index: 10;">
          <img src="https://soyo-hannam.com/images/quick-txt2.png" alt="Subscription" class="w-24 h-24">
        </span>
        <em class="quick-rot-bg2"></em>
      </a>
    </div>
    
    <!-- Rotating Button 1 -->
    <div class="rot relative w-32 h-32 flex items-center justify-center">
      <a href="https://soyohannam.com/" target="_blank" class="block relative w-full h-full flex items-center justify-center">
        <span class="relative z-10">
          <img src="https://soyo-hannam.com/images/quick-txt.png?ver=1" alt="Homepage" class="w-24 h-24">
        </span>
        <em class="quick-rot-bg"></em>
      </a>
    </div>
    
    <!-- Register Button -->
    <div class="reg_btn">
      <button class="bg-white text-gray-800 px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-gray-100 transition-all duration-300">
        <span>관심고객등록</span>
      </button>
    </div>
    
    <!-- Phone Number -->
    <div class="fix_tel">
      <a href="tel:1660-0730" class="block bg-blue-600 text-white text-center px-6 py-3 rounded-full font-bold text-lg shadow-lg hover:bg-blue-700 transition-all duration-300">
        1660-0730
      </a>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
